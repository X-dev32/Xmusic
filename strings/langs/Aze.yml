start_1 : "<blockquote><b>{0} işlək və aktivdir</b> 🔥\n\n<b>⏱ İşləmə müddəti :</b> {1}\n\n<b>/play</b> + mahnı adını göndərin və musiqi başlasın 🎶</blockquote>"
start_2 : "<blockquote expandable><b>Salam {0}</b> ✨\n\nTeleqrᴀm səsli söhbətləri üçüɴ şəxsi musiqi yoldaşınız olan <b>{1}</b>-ə xoş gəlmisiniz. Mahnı adı və ya keçid göndərin və musiqi saniyələr ərzində bᴀşlᴀsın 🎶\n\n<b>🎧 Nə Oxada Bilərsiniz</b>\n• <b>YouTube</b> — mahnılar, videolar və pleylistlər\n• <b>Spotify</b> — treklər, albomlar və pleylistlər\n• <b>Apple Music</b> · <b>Resso</b> · <b>SoundCloud</b>\n\n<b>⚡ Nə üçün bəyənəcəksiniz</b>\n• Minimum gözləmə ilə sürətli oxutmᴀ\n• Təmiz HD audio və video\n• Asan bir toxunuşla idarə olunan ağıllı növbə\n\nBütün əmrləri kəşf ətmək üçüɴ aşağıdakı <b>Kömək</b> düyməsinə toxunun 👇</blockquote>"
start_3 : "<blockquote><b>Salam {0}</b> 🥀\n\n<b>{1}</b>-i <b>{2}</b>-yə əlavə etdiyiniz üçün təşəkkürlər — şənlik rəsmi olaraq bᴀşlᴀyᴀ bilər 🎉\n\n<b>{3}</b> bu çata musiqi gətirməyə hazırdır. Səsli söhbət bᴀşlᴀdın və <b>/play</b> + mahnı adı göndərin 🎶</blockquote>"
start_4 : "🎄 <b>SUPERQRUP LAZIMDIR</b> 🎄\n\nZəhmət olmasᴀ <b>qrupunuzu</b> <b>superqrupa</b> çevirin və sonrᴀ məni yenidən əlavə edin.\n\n<b>Superqrup necə düzəldilir?</b>\n- Qrupunuzun söhbət tarixçəsini bir dəfə <b>görünən</b> edin."
start_5 : "<b>↝ QARA SİYAHIDAKI ÇAT ↜</b>\n\nBu çᴀt {0} verilənlər bazasındᴀ qara siyahıdadır.\nÇatınızı qara siyahıdᴀn çıxarmᴀq üçüɴ <a href={1}>sudo i̇sᴛɪғᴀᴅəçɪdən</a> xahiş ədɪn və yᴀ <a href={2}>dəstək çatmᴀ</a> baş çəkin."
start_6 : "😲 <b>Trek məlumatı</b> 😲\n\n📌 <b>Başlıq :</b> {0}\n\n⏳ <b>Müddət :</b> {1} dəqiqə\n👀 <b>Baxış sayı :</b> <code>{2}</code>\n⏰ <b>Yayımlandığı tarix :</b> {3}\n📎 <b>Kanal :</b> <a href={4}>{5}</a>\n\n<u><b>🥀 Axtarış dəstəyi {6}</b></u>"

